<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MI CHAT</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Login -->
  <div id="login-container">
    <h2>¿Cómo te llamas?</h2>
    <input id="nombre-input" type="text" placeholder="Tu nombre..."/>
    <button id="btn-entrar">Entrar al chat</button>
  </div>

  <!-- Chat -->
  <div id="chat-container" style="display:none">
    <div id="header">💬 Mi chat en tiempo real</div>
    <div id="mensajes"></div>
    <div id="input-area">
      <input id="input" type="text" placeholder="Escribe un mensaje..."/>
      <!-- Botón para adjuntar archivos -->
      <label id="btn-adjuntar" title="Adjuntar archivo">📎
        <input id="file-input" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" style="display:none"/>
      </label>
      <button id="btn-enviar">Enviar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
